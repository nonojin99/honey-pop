; 익스포트 설정 — Web(HTML5) 과 Android.
;
; ── Web ──
; variant/thread_support=false 로 둔다. 스레드를 켜면 브라우저가 SharedArrayBuffer 를 요구하고,
; 그건 서버가 COOP/COEP 헤더를 내려줘야 동작한다. 정적 호스팅에 그냥 얹으려면 무스레드가 맞다.
; (템플릿도 web_nothreads_release.zip 이 쓰인다)
;
; ── iOS ──
; 프리셋이 없는 건 빠뜨린 게 아니다. Godot 의 iOS 익스포트 산출물은 .ipa 가 아니라 Xcode
; 프로젝트이고, 서명·빌드는 macOS + Xcode 에서만 된다. 이 PC 는 Windows 라 만들 수 없다.
; 자세한 건 README 의 "애플에서도 설치되나" 참고.

